### **Étape 6 : Création de la première entité JPA (`Vehicule`)**[cite: 1]

1. **Créer l'énumération `StatutVehicule` dans `domain`**[cite: 1] :
```java
package tn.esprit.autoloc.domain;

public enum StatutVehicule {
DISPONIBLE, LOUE, MAINTENANCE
}
```[cite: 1]

2. **Créer l'énumération `CategorieVehicule` dans `domain`**[cite: 1] :
```java
package tn.esprit.autoloc.domain;

public enum CategorieVehicule {
CITADINE, BERLINE, SUV, UTILITAIRE
}
```[cite: 1]

3. **Créer la classe `Vehicule` dans `domain`**[cite: 1] :
```java
package tn.esprit.autoloc.domain;

import jakarta.persistence.*;
import lombok.AllArgsConstructor;
import lombok.Getter;
import lombok.NoArgsConstructor;
import lombok.Setter;
import java.math.BigDecimal;

@Entity
@Table(name = "vehicule")
@Getter
@Setter
@NoArgsConstructor
@AllArgsConstructor
public class Vehicule {

@Id
@GeneratedValue(strategy = GenerationType.IDENTITY)
private Long idVehicule;

@Column(nullable = false, unique = true, length = 20)
private String immatriculation;

@Column(nullable = false, length = 50)
private String marque;

@Column(nullable = false, length = 50)
private String modele;

@Enumerated(EnumType.STRING)
@Column(nullable = false, length = 20)
private CategorieVehicule categorie;

@Column(nullable = false, precision = 10, scale = 2)
private BigDecimal tarifJournalier;

@Enumerated(EnumType.STRING)
@Column(nullable = false, length = 20)
private StatutVehicule statut;
}
```[cite: 1]

